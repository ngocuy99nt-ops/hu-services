services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: hu-service-portfolio:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CONTACT_TO_EMAIL=${CONTACT_TO_EMAIL}
      - CONTACT_FROM_EMAIL=${CONTACT_FROM_EMAIL}
    restart: unless-stopped
